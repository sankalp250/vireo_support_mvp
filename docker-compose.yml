services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vireo
      POSTGRES_USER: vireo
      POSTGRES_PASSWORD: vireo
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U vireo -d vireo"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://vireo:vireo@db:5432/vireo
      DATA_DIR: /app/data
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python","-m","app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://vireo:vireo@db:5432/vireo
      DATA_DIR: /app/data
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
